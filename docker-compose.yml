services:
  db-init:
    build: 
      context: .
      dockerfile: Dockerfile.db-init
    volumes:
      - ./db/block_db.sqlite:/db/block_db.sqlite
      - ./data:/data

    network_mode: host
  server:
    build: 
      context: .
      dockerfile: Dockerfile.server
    depends_on:
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./db/block_db.sqlite:/db/block_db.sqlite
      - ./data:/data
    network_mode: host

  background:
    build: 
      context: .
      dockerfile: Dockerfile.background
    depends_on:
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./db/block_db.sqlite:/db/block_db.sqlite
      - ./data:/data
    network_mode: host
